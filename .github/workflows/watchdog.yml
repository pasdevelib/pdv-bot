name: watchdog

on:
  schedule:
    - cron: '*/15 * * * *'  # Toutes les 15 min
  workflow_dispatch:

# BUG CORRIGE ICI (2026-09-27) : contents passe a `write` — watchdog.py
# ecrit desormais un petit marqueur d'etat (watchdog_alert_state.txt) sur
# la release "live" pour eviter de renvoyer un email toutes les 15 min
# pendant une panne prolongee (voir pasdevelib/watchdog.py).
permissions:
  contents: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e . requests
      - name: Check freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: pasdevelib/pdv-bot
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WATCHDOG_ALERT_EMAIL: hello@pasdevelib.app
        run: python -m pasdevelib.watchdog
