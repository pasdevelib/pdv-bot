name: forecast

on:
  schedule:
    # Tous les jours à 05:30 UTC (après aggregate.yml hebdo et weather.yml)
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    # BUG CORRIGE ICI : le run du 19 aout a ete tue net a 20min17s
    # (cancelled, pas failed) - pile au budget precedent. Le correctif sur
    # le matching des jours analogues (enrichissement meteo/saison des
    # candidats, cf. predict.py) ajoute un peu de calcul, suffisant pour
    # depasser la limite. Porte a 35 min, marge confortable.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Run forecast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pasdevelib.forecast
