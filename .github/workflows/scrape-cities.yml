name: scrape-cities

# BUG CORRIGE ICI (2026-09-28) : ce repo comptait 32 workflows programmes,
# dont 11 sur */5 min (scrape.yml + 8 fichiers scrape-<ville>.yml + notify.yml
# + check-train-alerts.yml). Meme apres avoir supprime la course a l'ecriture
# du 27 juin (voir scrape.yml), le cron du scraper Paris ne se declenchait
# encore qu'environ 5 fois en 17h au lieu des ~204 attendues — la cause
# n'etait donc pas seulement la race, mais bien le nombre total de
# declarations "schedule" distinctes dans ce depot : GitHub Actions retarde
# et laisse tomber la plupart des declenchements programmes quand un meme
# depot en cumule trop, en particulier a haute frequence (comportement
# documente, aggrave ici par la multiplication de fichiers quasi identiques).
#
# Ce fichier remplace les 8 workflows scrape-<ville>.yml (bordeaux, lille,
# lyon, montpellier, nantes, rennes, strasbourg, toulouse), qui avaient
# chacun leur propre cron */5 min = 8 declarations programmees rien que pour
# les villes. Avec une matrice, GitHub n'enregistre plus qu'UN SEUL cron
# pour les 8 villes, tout en gardant l'isolation demandee a l'origine
# (fail-fast: false => un plantage sur une ville n'annule jamais les autres,
# exactement comme avec des fichiers separes).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    name: Scrape ${{ matrix.city }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        city: [bordeaux, lille, lyon, montpellier, nantes, rennes, strasbourg, toulouse]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -e . requests pandas pyarrow

      - name: Scrape ${{ matrix.city }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pasdevelib.scrape_cities --cities ${{ matrix.city }}
