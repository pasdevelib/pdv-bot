name: daily-digest

# Bilan quotidien du réseau, rédigé par Gemini. Tourne ici (pas dans
# pdvr-bot) car la source de données — stats_<ville>_*.json, release
# "stats-cities" — est déjà centralisée ici pour les 9 villes (voir
# stats-cities.yml). Sortie publiée sur
# blog.pasdevelib.app/blog/articles/dailymonitoring/<ville>.
#
# BUG CORRIGE ICI (2026-09-28) : une clé Gemini unique partagée entre
# toutes les villes se heurtait au quota très bas du tier gratuit (429
# "limit: 5"/min). Théo a créé une clé Google AI Studio PAR VILLE
# (quota indépendant) — chacune en secret GEMINI_API_KEY_<VILLE>. Le
# script (daily_digest.py) résout automatiquement la bonne clé par
# ville et saute proprement celles qui n'en ont pas encore.
#
# SIMPLIFIE (2026-09-29, demande Théo : "je veux juste le daily de
# paris") : l'essai MISTRAL_API_KEY du 2026-09-28 s'est révélé
# définitivement cassé côté compte Mistral (HTTP 429 "Rate limit
# exceeded" sur 100% des appels, deux jours de suite, dès la toute
# première tentative — pas un problème de cadence ni de code). Le
# secret gaspillait ~5 min par run en retries avant même d'atteindre le
# repli Gemini (daily_digest.py essaie encore Mistral en premier s'il
# reçoit la variable, cf. son code). Retiré ici : on va direct sur
# GEMINI_API_KEY_PARIS, qui a déjà fonctionné (run du 2026-09-28 19h11).
# --cities paris : on ne tente plus les 8 autres villes, qui n'ont de
# toute façon pas de clé Gemini dédiée ET dont pdvr-bot ne produit
# aucune donnée actuellement (cf. discussion) — inutile de les faire
# échouer à chaque run. Pour les relancer un jour : retirer --cities et
# recréer GEMINI_API_KEY_<VILLE> (ou réessayer Mistral une fois leur
# compte débloqué).
on:
  schedule:
    # 06:30 UTC, après stats-cities.yml (06:00)
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    name: Daily digest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e . requests
      - name: Generate digest — Paris (Gemini)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY_PARIS: ${{ secrets.GEMINI_API_KEY_PARIS }}
        run: python -m pasdevelib.daily_digest --cities paris
